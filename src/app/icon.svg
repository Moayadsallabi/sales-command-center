<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Perceptionism Lab">
  <!-- Tab icon. Two differences from logo.svg, both because 16px is the size
       that actually matters here:
         · a dark plate, so the gold always sits on the background it was drawn
           for instead of on whatever colour the browser paints its tab strip;
         · no iris ring — three concentric strokes inside 16 pixels resolve as
           one smudge, so the ring is dropped and the pupil carries the centre. -->
  <defs>
    <linearGradient id="pl-gold-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0882a"/>
      <stop offset="0.42" stop-color="#f0d98a"/>
      <stop offset="1" stop-color="#c99b32"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <path d="M6 32C17 15 47 15 58 32 47 49 17 49 6 32Z"
        fill="none" stroke="url(#pl-gold-fav)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="6.4" fill="url(#pl-gold-fav)"/>
</svg>
